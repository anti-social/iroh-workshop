[package]
name = "chat-gossip"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.6"
dirs = "7.0.0"
iroh = "1.4.1"
iroh-gossip = "0.101"
n0-future = "0.3"
postcard = { version = "1", features = ["use-std"] }
rand = "0.10"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tui-textarea = "0.7.0"
